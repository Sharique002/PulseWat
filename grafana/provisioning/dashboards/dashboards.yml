# ============================================================
# PulseWat — Grafana Dashboard Provisioning
# Auto-loads dashboards from the mounted volume
# ============================================================

apiVersion: 1

providers:
  - name: "PulseWat Dashboards"
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
