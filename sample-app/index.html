<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PulseWat — Sample Service</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f1117;
      color: #e1e4e8;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      text-align: center;
      padding: 3rem 4rem;
      border: 1px solid #21262d;
      border-radius: 12px;
      background: #161b22;
    }
    .pulse {
      display: inline-block;
      width: 12px; height: 12px;
      background: #3fb950;
      border-radius: 50%;
      margin-right: 8px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(63,185,80,0.5); }
      50% { opacity: .8; box-shadow: 0 0 0 8px rgba(63,185,80,0); }
    }
    h1 { font-size: 1.5rem; margin-bottom: .5rem; }
    p { color: #8b949e; font-size: .9rem; }
    .status { margin-top: 1.5rem; font-size: .85rem; color: #3fb950; }
  </style>
</head>
<body>
  <div class="card">
    <h1><span class="pulse"></span>PulseWat Sample Service</h1>
    <p>This Nginx container is being monitored by PulseWat.</p>
    <div class="status">● Service Healthy</div>
  </div>
</body>
</html>
