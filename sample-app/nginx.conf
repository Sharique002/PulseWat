server {
    listen 80;
    server_name localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
    }

    # Stub status for basic metrics
    location /nginx_status {
        stub_status on;
        access_log off;
    }

    # Health endpoint
    location /health {
        access_log off;
        return 200 '{"status":"healthy","service":"pulsewat-sample-app"}';
        add_header Content-Type application/json;
    }
}
